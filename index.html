<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps/SecOps Technical Task</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #10b981; /* Green */
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #6b7280; margin-bottom: 1.5rem; }
        .candidate-name {
            font-weight: bold;
            color: #2563eb; /* Blue */
            font-size: 1.2rem;
            padding: 10px;
            background: #eff6ff;
            border-radius: 6px;
            display: block;
            margin: 1rem 0;
        }
        .timestamp {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 2rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div>
            <span class="status-dot"></span>
            <span style="font-weight: 600; color: #10b981;">SYSTEM ONLINE</span>
        </div>

        <h1>CloudFront Deployment</h1>
        <p>Secure Static Site via CloudFormation</p>

        <div class="candidate-name">Deployed by Hristo Iliev - TEST </div>
        
        <div class="timestamp">
            <span id="time">Loading...</span>
        </div>
    </div>

    <script>
        // Simple script to show render time. 
        const now = new Date();
        document.getElementById('time').innerText = now.toString();
    </script>

</body>
</html>
